<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${phone.name} + ' — Anshu Store'">
        Phone Details
    </title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>

        /* ── DETAILS CARD ────────────────────────── */
        .details-card {
            background: #ffffff;
            border: 1px solid rgba(20,20,43,0.09);
            border-radius: 24px;
            padding: 48px 44px;
            box-shadow: 0 2px 16px rgba(20,20,43,0.07),
                        0 6px 28px rgba(20,20,43,0.04);
        }

        /* ── IMAGE WRAP ──────────────────────────── */
        .phone-image-wrap {
            background: #f7f5f1;
            border-radius: 20px;
            padding: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 420px;
            overflow: hidden;
        }

        .phone-image {
            width: 100%;
            max-height: 420px;
            object-fit: contain;
            transition: transform 0.5s cubic-bezier(0.25,0.8,0.25,1);
        }

        .phone-image-wrap:hover .phone-image {
            transform: scale(1.06);
        }

        /* ── BRAND BADGE ─────────────────────────── */
        .brand-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #2563eb;
            background: rgba(37,99,235,0.09);
            padding: 5px 16px;
            border-radius: 100px;
            margin-bottom: 16px;
        }

        /* ── PHONE NAME ──────────────────────────── */
        .phone-name {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            font-weight: 700;
            color: #14142b;
            letter-spacing: -0.025em;
            line-height: 1.15;
            margin-bottom: 20px;
        }

        /* ── PRICE ───────────────────────────────── */
        .phone-price {
            font-size: 2rem;
            font-weight: 700;
            color: #14142b;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .price-note {
            font-size: 0.78rem;
            color: #72728a;
            margin-bottom: 24px;
        }

        /* ── DIVIDER ─────────────────────────────── */
        .info-divider {
            height: 1px;
            background: rgba(20,20,43,0.07);
            margin: 24px 0;
        }

        /* ── DESCRIPTION ─────────────────────────── */
        .phone-desc {
            font-size: 0.95rem;
            color: #52526a;
            line-height: 1.85;
            margin-bottom: 0;
        }

        /* ── FEATURES LIST ───────────────────────── */
        .features-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .features-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.88rem;
            color: #14142b;
            font-weight: 500;
        }

        .features-list li span.feat-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(37,99,235,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        /* ── ADD TO CART BTN — off-white → blue ──── */
        .btn-add-cart {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f5f3ee;
            color: #14142b;
            border: 1.5px solid rgba(20,20,43,0.15);
            padding: 14px 28px;
            border-radius: 100px;
            font-family: 'DM Sans', system-ui, sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.32s ease, color 0.32s ease,
                        border-color 0.32s ease, box-shadow 0.32s ease,
                        transform 0.18s;
        }

        .btn-add-cart:hover {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 8px 24px rgba(37,99,235,0.28);
            transform: translateY(-2px);
        }

        .btn-add-cart:active {
            transform: scale(0.97);
        }

        /* ── BUY NOW BTN — off-white → blue darker── */
        .btn-buy-now {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #14142b;
            color: #ffffff;
            border: 1.5px solid #14142b;
            padding: 14px 28px;
            border-radius: 100px;
            font-family: 'DM Sans', system-ui, sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.32s ease, color 0.32s ease,
                        border-color 0.32s ease, box-shadow 0.32s ease,
                        transform 0.18s;
        }

        .btn-buy-now:hover {
            background: #2563eb;
            border-color: #2563eb;
            box-shadow: 0 8px 24px rgba(37,99,235,0.28);
            transform: translateY(-2px);
        }

        /* ── BACK LINK ───────────────────────────── */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #72728a;
            text-decoration: none;
            padding: 8px 18px;
            border: 1.5px solid rgba(20,20,43,0.12);
            border-radius: 100px;
            background: #f5f3ee;
            transition: background 0.32s ease, color 0.32s ease,
                        border-color 0.32s ease, box-shadow 0.32s ease,
                        transform 0.18s;
        }

        .back-link:hover {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 6px 18px rgba(37,99,235,0.22);
            transform: translateY(-1px);
        }

        /* ── RESPONSIVE ──────────────────────────── */
        @media (max-width: 768px) {
            .details-card { padding: 28px 20px; }
            .phone-image-wrap { min-height: 280px; }
            .phone-name { font-size: 1.8rem; }
        }

    </style>

</head>

<body>

<!-- ── NAVBAR ─────────────────────────────────── -->
<nav class="navbar navbar-expand-lg">

    <div class="container-fluid px-4">

        <a class="navbar-brand" href="/">
            📱 Anshu Store
        </a>

        <div class="ms-auto">
            <a href="/cart" class="nav-action-btn">
                🛒 View Cart
            </a>
        </div>

    </div>

</nav>

<!-- ── PRODUCT DETAILS ────────────────────────── -->
<div class="container py-5">

    <!-- Back -->
    <div class="mb-4">
        <a href="/" class="back-link">
            ← Back to Products
        </a>
    </div>

    <div class="details-card">

        <div class="row align-items-center g-5">

            <!-- Image -->
            <div class="col-lg-6">

                <div class="phone-image-wrap">

                    <img th:src="@{${phone.imageUrl}}"
                         th:alt="${phone.name}"
                         class="phone-image">

                </div>

            </div>

            <!-- Info -->
            <div class="col-lg-6">

                <!-- Brand -->
                <span class="brand-badge"
                      th:text="${phone.brand}">
                </span>

                <!-- Name -->
                <h1 class="phone-name"
                    th:text="${phone.name}">
                </h1>

                <!-- Price -->
                <div class="phone-price">
                    ₹<span th:text="${#numbers.formatDecimal(
                        phone.price,1,'COMMA',0,'POINT')}">
                    </span>
                </div>

                <p class="price-note">
                    Inclusive of all taxes
                </p>

                <div class="info-divider"></div>

                <!-- Description -->
                <p class="phone-desc"
                   th:text="${phone.description}">
                </p>

                <div class="info-divider"></div>

                <!-- Features -->
                <ul class="features-list mb-4">

                    <li>
                        <span class="feat-icon">🚚</span>
                        Fast Delivery Available
                    </li>

                    <li>
                        <span class="feat-icon">🔒</span>
                        Secure Payment
                    </li>

                    <li>
                        <span class="feat-icon">✅</span>
                        Official Brand Warranty
                    </li>

                    <li>
                        <span class="feat-icon">💳</span>
                        EMI Options Available
                    </li>

                </ul>

                <!-- Buttons — logic unchanged -->
                <div class="d-flex flex-wrap gap-3 mt-2">

                    <form th:action="@{/cart/add/{id}(id=${phone.id})}"
                          method="post">

                        <button type="submit"
                                class="btn-add-cart">
                            🛒 Add to Cart
                        </button>

                    </form>

                    <button class="btn-buy-now">
                        ⚡ Buy Now
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- ── FOOTER ─────────────────────────────────── -->
<footer>
    <p>© 2026 Anshu Phone Store. All Rights Reserved.</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
