<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Phone — Anshu Store</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>

        /* ── UPLOAD BOX ─────────────────────────── */
        .upload-box {
            border: 2px dashed rgba(20,20,43,0.15);
            border-radius: 18px;
            padding: 44px 40px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.32s cubic-bezier(0.25,0.8,0.25,1),
                        background 0.32s cubic-bezier(0.25,0.8,0.25,1),
                        box-shadow 0.32s cubic-bezier(0.25,0.8,0.25,1);
            background: #f7f5f1;
            position: relative;
        }

        .upload-box:hover {
            border-color: #2563eb;
            background: #eff6ff;
            box-shadow: 0 0 0 4px rgba(37,99,235,0.08);
        }

        .upload-box.dragover {
            border-color: #2563eb;
            background: #eff6ff;
            box-shadow: 0 0 0 6px rgba(37,99,235,0.12);
        }

        .upload-icon {
            font-size: 2.8rem;
            margin-bottom: 14px;
            display: block;
            transition: transform 0.3s ease;
        }

        .upload-box:hover .upload-icon {
            transform: translateY(-4px) scale(1.08);
        }

        .upload-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #14142b;
            margin-bottom: 6px;
        }

        .upload-sub {
            font-size: 0.82rem;
            color: #72728a;
            margin-bottom: 0;
        }

        .upload-sub span {
            color: #2563eb;
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        #imageFile {
            display: none;
        }

        /* ── PREVIEW ────────────────────────────── */
        .preview-wrap {
            margin-top: 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .preview-wrap.active {
            display: flex;
        }

        .preview-img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            border-radius: 16px;
            background: #ffffff;
            padding: 10px;
            box-shadow: 0 6px 24px rgba(20,20,43,0.10);
            border: 1px solid rgba(20,20,43,0.08);
        }

        .preview-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: #2563eb;
            background: rgba(37,99,235,0.08);
            padding: 4px 14px;
            border-radius: 100px;
        }

        /* ── ERROR BOX ──────────────────────────── */
        .error-box {
            background: #fff0f2;
            border: 1px solid rgba(232,65,90,0.25);
            color: #c0283e;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 24px;
            font-weight: 500;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ── FORM DIVIDER ───────────────────────── */
        .field-divider {
            height: 1px;
            background: rgba(20,20,43,0.07);
            margin: 28px 0;
        }

        /* ── PRICE INPUT FIX ────────────────────── */
        .input-group-text {
            background: #f7f5f1 !important;
            border: 1.5px solid rgba(20,20,43,0.09) !important;
            border-right: none !important;
            color: #72728a;
            font-size: 1rem;
            border-radius: 12px 0 0 12px !important;
            padding: 12px 16px;
        }

    </style>

</head>

<body>

<!-- ── NAVBAR ─────────────────────────────────── -->
<nav class="navbar navbar-expand-lg">

    <div class="container-fluid px-4">

        <a class="navbar-brand" href="/">
            📱 Anshu Store
        </a>

        <div class="ms-auto">
            <a href="/" class="nav-action-btn">
                ← Back to Store
            </a>
        </div>

    </div>

</nav>

<!-- ── FORM PAGE ──────────────────────────────── -->
<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-7 col-xl-6">

            <div class="form-card">

                <!-- ── HEADER ───────────────────── -->
                <div class="form-card-header">

                    <h2>Add New Phone</h2>

                    <p>
                        Fill in the details and upload
                        an image to list a new phone.
                    </p>

                </div>

                <!-- ── ERROR MESSAGE ─────────────── -->
                <div class="error-box"
                     th:if="${error}">
                    <span>⚠️</span>
                    <span th:text="${error}"></span>
                </div>

                <!-- ── FORM ──────────────────────── -->
                <form th:action="@{/add}"
                      th:object="${phone}"
                      method="post"
                      enctype="multipart/form-data">

                    <!-- Phone Name -->
                    <div class="mb-4">

                        <label class="field-label">
                            Phone Name
                        </label>

                        <input type="text"
                               class="form-control field-input"
                               th:field="*{name}"
                               placeholder="e.g. iPhone 16 Pro"
                               required>

                    </div>

                    <!-- Brand -->
                    <div class="mb-4">

                        <label class="field-label">
                            Brand
                        </label>

                        <select class="form-select field-input"
                                th:field="*{brand}"
                                required>

                            <option value="">— Select Brand —</option>
                            <option value="Apple">Apple</option>
                            <option value="Samsung">Samsung</option>
                            <option value="OnePlus">OnePlus</option>
                            <option value="Google">Google</option>
                            <option value="Xiaomi">Xiaomi</option>
                            <option value="Realme">Realme</option>
                            <option value="Vivo">Vivo</option>
                            <option value="OPPO">OPPO</option>
                            <option value="Nothing">Nothing</option>
                            <option value="Motorola">Motorola</option>
                            <option value="IQOO">IQOO</option>
                            <option value="ASUS">ASUS</option>
                            <option value="Nokia">Nokia</option>
                            <option value="Sony">Sony</option>
                            <option value="Huawei">Huawei</option>
                            <option value="Honor">Honor</option>
                            <option value="Infinix">Infinix</option>
                            <option value="Tecno">Tecno</option>
                            <option value="Lava">Lava</option>
                            <option value="Other">Other</option>

                        </select>

                    </div>

                    <!-- Description -->
                    <div class="mb-4">

                        <label class="field-label">
                            Description
                        </label>

                        <textarea class="form-control field-input"
                                  th:field="*{description}"
                                  rows="3"
                                  placeholder="Brief description of the phone..."
                                  required></textarea>

                    </div>

                    <!-- Price -->
                    <div class="mb-4">

                        <label class="field-label">
                            Price (₹)
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">₹</span>

                            <input type="number"
                                   class="form-control field-input"
                                   th:field="*{price}"
                                   placeholder="e.g. 49999"
                                   min="0"
                                   required>

                        </div>

                    </div>

                    <!-- Divider -->
                    <div class="field-divider"></div>

                    <!-- Image Upload -->
                    <div class="mb-4">

                        <label class="field-label mb-3">
                            Phone Image
                        </label>

                        <div class="upload-box" id="dropArea">

                            <span class="upload-icon">📸</span>

                            <p class="upload-title">
                                Drag & Drop your image here
                            </p>

                            <p class="upload-sub">
                                or <span>click to browse</span>
                                &nbsp;·&nbsp; PNG, JPG, WEBP
                            </p>

                            <!-- hidden file input — logic unchanged -->
                            <input type="file"
                                   id="imageFile"
                                   name="imageFile"
                                   accept="image/*">

                            <!-- Preview — shown after file selected -->
                            <div class="preview-wrap" id="previewWrap">

                                <img id="preview"
                                     class="preview-img"
                                     alt="Preview">

                                <span class="preview-label"
                                      id="previewName">
                                </span>

                            </div>

                        </div>

                    </div>

                    <!-- Submit -->
                    <button type="submit"
                            class="btn-submit w-100 mt-2">
                        Save Phone →
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<!-- ── FOOTER ─────────────────────────────────── -->
<footer>
    <p>© 2026 Anshu Phone Store. All Rights Reserved.</p>
</footer>

<!-- ── SCRIPTS ────────────────────────────────── -->
<script>

    const dropArea   = document.getElementById("dropArea");
    const fileInput  = document.getElementById("imageFile");
    const preview    = document.getElementById("preview");
    const previewWrap = document.getElementById("previewWrap");
    const previewName = document.getElementById("previewName");

    // Click to open file browser
    dropArea.addEventListener("click", () => {
        fileInput.click();
    });

    // File selected via browser
    fileInput.addEventListener("change", () => {
        showPreview(fileInput.files[0]);
    });

    // Drag over
    dropArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropArea.classList.add("dragover");
    });

    // Drag leave
    dropArea.addEventListener("dragleave", () => {
        dropArea.classList.remove("dragover");
    });

    // Drop
    dropArea.addEventListener("drop", (e) => {
        e.preventDefault();
        dropArea.classList.remove("dragover");
        const file = e.dataTransfer.files[0];
        fileInput.files = e.dataTransfer.files;
        showPreview(file);
    });

    // Show image preview — logic unchanged
    function showPreview(file) {

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function(e) {
            preview.src = e.target.result;
            previewWrap.classList.add("active");
            previewName.textContent = file.name;
        };

        reader.readAsDataURL(file);
    }

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
